spring:
    application:
        name: filmapi
    datasource:
        url: jdbc:mysql://localhost:3306/watchlist?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
        username: root
        password: root
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
    properties:
        hibernate:
            dialect: org.hibernate.dialect.MySQLDialect

watchmode:
  api:
    key: YOUR_WATCHMODE_API_KEY
